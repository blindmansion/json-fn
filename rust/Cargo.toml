[package]
name = "jsonfn"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Tree-walking interpreter for json-fn, a pure-JSON expression language."
license = "MIT"
repository = "https://github.com/nickconfer/json-fn"
readme = "README.md"

[lib]
name = "jsonfn"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
