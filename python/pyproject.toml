[project]
name = "json-fn"
version = "0.1.0"
description = "Tree-walking interpreter for json-fn, a pure-JSON expression language."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "blindmansion", email = "blindmansion@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/nickconfer/json-fn"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jsonfn"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--benchmark-disable"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"benches/*" = ["B011"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
include = ["src", "tests", "benches"]
typeCheckingMode = "standard"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
ignore_missing_imports = true
